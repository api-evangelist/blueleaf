name: BlueLeaf
description: >-
  Blueleaf is a wealth management software platform for financial advisors and enterprise
  RIAs that combines a branded client portal, automated investment performance reporting,
  account aggregation across custodians and institutions, automated billing, and portfolio
  rebalancing into one system. Its data-access API lets partners pull householded account
  balances, holdings, and transactions without handling end-user banking credentials, and
  it operates an OAuth 2.0 / OpenID Connect identity provider at secure.blueleaf.com.
  Blueleaf is backed by 500 Global and Anthemis and was added to the API Evangelist network
  and enriched from its public developer, security, and OIDC discovery surfaces.
